<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABSA 独立人工审核</title>
<style>
:root{font:16px/1.55 system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#14213d;background:#f4f6fa}
*{box-sizing:border-box}body{margin:0}header{background:#132444;color:#fff;padding:1rem max(1rem,calc((100vw - 1180px)/2))}
header h1{margin:.1rem 0;font-size:1.5rem}header p{margin:.2rem 0;color:#d6e4fa}
main{max-width:1180px;margin:auto;padding:1rem}.toolbar,.row{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap}
.toolbar{background:#fff;padding:1rem;border-radius:10px;box-shadow:0 2px 10px #13244412;margin-bottom:1rem}
button,select,input,textarea{font:inherit}button{border:1px solid #2a5db0;background:#fff;color:#174584;border-radius:7px;padding:.4rem .7rem;cursor:pointer}
button.active,.primary{background:#184f9d;color:#fff}button:focus,select:focus,input:focus,textarea:focus{outline:2px solid #f3a712}
button:disabled,select:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=date],textarea{padding:.4rem;border:1px solid #aebbd0;border-radius:6px;background:#fff;max-width:100%}
textarea{width:100%;min-height:5rem}label{display:block;font-weight:600;margin:.65rem 0 .2rem}
section,.card{background:#fff;border:1px solid #d9e1ed;border-radius:9px;padding:1rem;margin:.8rem 0}
.muted{color:#526078}.badge{display:inline-block;padding:.15rem .5rem;border-radius:20px;background:#e4eefd;color:#184f9d;font-size:.9rem}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6fa;padding:.8rem;border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.93rem}th,td{padding:.45rem;border:1px solid #d9e1ed;text-align:left;vertical-align:top}th{background:#eaf0f9}
td:first-child{white-space:pre}td:nth-child(2){min-width:22rem}.scroll{overflow:auto;max-height:34rem}small{display:block;color:#526078}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8rem}.notice{border-left:5px solid #e69b0c;background:#fff9e9}
.status{font-weight:700;color:#184f9d}.status.review{color:#9a5800}.filters label{margin:0}.filters select{min-width:8rem}
details{margin:.5rem 0}summary{cursor:pointer;color:#174584}
@media(max-width:700px){td:nth-child(2){min-width:14rem}header,main{padding:1rem}}
</style>
</head>
<body>
<header><h1>ABSA 独立人工审核 · <span id="reviewer-label"></span></h1><p>本地离线材料 · 人工判断保持空白 · 不包含正式模型预测</p></header>
<main>
<section class="notice"><strong>开始前：</strong>先选择审核类型，再导入压缩包中对应的 CSV，页面才会显示审核记录。请阅读同包的 START_HERE_ZH.md。每次离开前分别下载两份已填 CSV；下次继续时重新导入。含 SemEval 数据，请勿公开上传。</section>
<div class="toolbar">
<button id="ex-tab" class="active" type="button">抽取差异（13）</button>
<button id="qu-tab" type="button">正式候选题（120）</button>
<label for="item-select">当前条目</label><select id="item-select"></select>
<button id="previous" type="button">上一条</button><button id="next" type="button">下一条</button><button id="next-incomplete" type="button">下一条未完成</button>
</div>
<div class="toolbar filters">
<label for="pack-filter">Pack</label><select id="pack-filter"></select>
<label for="type-filter">题型</label><select id="type-filter"></select>
<label for="status-filter">状态</label><select id="status-filter"><option value="all">全部</option><option value="incomplete">未完成</option><option value="complete">已完成</option><option value="review">待复核</option></select>
</div>
<div class="toolbar">
<button id="export" class="primary" type="button">下载当前 CSV</button>
<label for="import">导入当前类型 CSV</label><input id="import" type="file" accept=".csv,text/csv">
<span id="import-help" class="muted"></span>
<span id="progress" class="badge"></span><span id="item-status" class="status"></span>
</div>
<div id="content"></div>
<section class="muted"><small>候选参考答案仅供审核，尚未冻结。页面不运行模型、不自动填写 yes/no 或差异结论。导入文件必须保持所有只读列原样。</small></section>
</main>
<script type="application/json" id="review-data">__REVIEW_DATA__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("review-data").textContent);
const REVIEWER="R"+data.slot;
document.getElementById("reviewer-label").textContent="Reviewer "+data.slot+"（"+REVIEWER+"）";
const EDIT={extraction:["human_decision","human_reason","reviewer","reviewed_at"],questions:["reviewer_id","wording_ok","answerability_ok","denominator_ok","reference_ok","proposed_edit","notes"]};
const OPTIONS={human_decision:["model_error","annotation_ambiguity","both_or_mixed","no_error","no_issue","unresolved"],wording_ok:["yes","no"],answerability_ok:["yes","no"],denominator_ok:["yes","no"],reference_ok:["yes","no"]};
const JUDGMENTS=["wording_ok","answerability_ok","denominator_ok","reference_ok"];
let current="extraction",index=0;
const loaded={extraction:false,questions:false};
const state={extraction:data.extraction.map(()=>({reviewer:REVIEWER})),questions:data.questions.map(row=>({reviewer_id:REVIEWER,denominator_ok:row.task_type==="rate"?"":"yes"}))};
const $=id=>document.getElementById(id);
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=String(text);if(cls)node.className=cls;return node;}
function rows(){return data[current]}
function value(field){return state[current][index][field]??rows()[index][field]??""}
function pretty(raw){try{return JSON.stringify(JSON.parse(raw),null,2)}catch(_error){return raw}}
function card(parent,title,content){const block=el("div",undefined,"card");block.append(el("h3",title),el("pre",content));parent.append(block)}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return false;const [y,m,d]=s.split("-").map(Number),actual=new Date(y,m-1,d);return actual.getFullYear()===y&&actual.getMonth()===m-1&&actual.getDate()===d}
function reviewStatus(kind,i){const row=state[kind][i];let complete,review=false;
 if(kind==="extraction"){complete=OPTIONS.human_decision.includes(row.human_decision)&&Boolean((row.human_reason||"").trim())&&row.reviewer===REVIEWER&&validDate(row.reviewed_at);review=complete&&!(["model_error","no_issue"].includes(row.human_decision))}
 else{complete=row.reviewer_id===REVIEWER&&JUDGMENTS.every(field=>OPTIONS[field].includes(row[field]))&&
  (data.questions[i].task_type==="rate"||row.denominator_ok==="yes")&&
  (!JUDGMENTS.some(field=>row[field]==="no")||Boolean((row.notes||"").trim()||(row.proposed_edit||"").trim()));
  review=complete&&JUDGMENTS.some(field=>row[field]==="no")}
 return {complete,review};}
function progress(){const statuses=data[current].map((_,i)=>reviewStatus(current,i)),done=statuses.filter(s=>s.complete).length,pending=statuses.filter(s=>s.review).length;
 $("progress").textContent="总数 "+statuses.length+" · 已完成 "+done+" · 未完成 "+(statuses.length-done)+" · 待复核 "+pending;
 const s=reviewStatus(current,index),label=$("item-status");label.textContent=s.complete?(s.review?"当前：已完成 · 待复核":"当前：已完成"):"当前：未完成";label.classList.toggle("review",s.review);
 const dateNote=$("date-note");if(dateNote)dateNote.textContent="审核者 "+REVIEWER+"；首次完成日期 "+(state.extraction[index].reviewed_at||"尚未记录")+"。再次编辑保留首次完成日期。";}
function field(parent,name,label){const holder=el("div");const caption=el("label",label);holder.append(caption);let input;
 if(OPTIONS[name]){input=el("select");input.append(el("option","-- 请选择 --"));input.firstChild.value="";for(const option of OPTIONS[name]){const item=el("option",option);item.value=option;input.append(item)}}
 else if(name==="human_reason"||name==="proposed_edit"||name==="notes")input=el("textarea");
 else {input=el("input");input.type="text";input.maxLength=120;}
 input.value=value(name);caption.append(input);input.addEventListener("input",()=>onEdit(name,input));
 parent.append(holder);
}
function onEdit(name,input){const row=state[current][index];row[name]=input.value;
 if(current==="extraction"&&OPTIONS.human_decision.includes(row.human_decision)&&(row.human_reason||"").trim()&&!validDate(row.reviewed_at))row.reviewed_at=today();
 progress();}
function renderExtraction(root,row){root.append(el("h2","抽取差异 · "+row.record_id));root.append(el("p",row.review_text));
 const grid=el("div",undefined,"grid");card(grid,"SemEval Gold",pretty(row.gold_aspects));card(grid,"Model prediction",pretty(row.predicted_aspects));card(grid,"Detected differences",pretty(row.differences));root.append(grid);
 const form=el("section");form.append(el("h3","人工判断"));for(const [name,label] of [["human_decision","判断类型"],["human_reason","判断理由（请引用原文依据）"]])field(form,name,label);
 const dateNote=el("small","");dateNote.id="date-note";form.append(dateNote);root.append(form);
}
function goldSummary(row,ids,gold){const aspects=id=>gold.get(id)?.aspects??[];
 const has=(id,category,sentiment)=>aspects(id).some(a=>a.category===category&&(!sentiment||a.sentiment===sentiment));
 const negative=category=>ids.filter(id=>has(id,category,"negative"));
 const listed=items=>items.length?items.join(", "):"none";
 if(row.task_type==="count"){const found=negative("service");return "Negative service: "+found.length+" reviews\nRecord IDs: "+listed(found)}
 if(row.task_type==="rate"){const category=row.rate_category||"service",num=negative(category),den=row.denominator_spec==="all_records"?ids:ids.filter(id=>has(id,category));return "Category: "+category+"\nNumerator (negative reviews): "+num.length+"; IDs: "+listed(num)+"\nDenominator ("+(row.denominator_spec==="all_records"?"all pack reviews":"reviews mentioning the category")+"): "+den.length+"; IDs: "+listed(den)+"\nRate: "+(den.length?num.length+"/"+den.length+" = "+(num.length/den.length).toFixed(4):"undefined (zero denominator)")}
 if(row.task_type==="selection"){const found=ids.filter(id=>has(id,"food","positive")&&has(id,"service","negative"));return "Positive food AND negative service: "+found.length+" reviews\nRecord IDs: "+listed(found)}
 if(row.task_type==="comparison"||row.task_type==="evidence_explanation"){const categories=row.task_type==="comparison"?["food","service"]:["food","service","price"],counts=categories.map(c=>[c,negative(c).length]),max=Math.max(...counts.map(x=>x[1]));return counts.map(([c,n])=>c+" negative: "+n+"; IDs: "+listed(negative(c))).join("\n")+"\nHighest count (including ties): "+listed(counts.filter(x=>x[1]===max).map(x=>x[0]))}
 return "Check which required metadata is missing. The source has record_id and text only.";
}
function referenceSummary(row){const reference=JSON.parse(row.reference_json);const keys={count:["count"],rate:["numerator","denominator","rate"],selection:["selected_record_ids"],comparison:["category_counts","comparison_groups"],evidence_explanation:["category_counts","comparison_groups","source_record_ids"],insufficient_info:["insufficient_info"]}[row.task_type]||[];
 return JSON.stringify(Object.fromEntries(keys.map(key=>[key,reference[key]])),null,2)}
function renderQuestion(root,row){root.append(el("h2",row.question_id+" · "+row.task_type));root.append(el("p",row.wording));
 const meta=el("p","Pack "+row.pack_id+" · Denominator: "+(row.denominator_spec||"N/A")+" · Rate category: "+(row.rate_category||"N/A"),"muted");root.append(meta);
 const ids=JSON.parse(row.record_ids),records=new Map(data.testRecords.map(r=>[r.record_id,r])),gold=new Map(data.goldRecords.map(r=>[r.record_id,r]));
 const grid=el("div",undefined,"grid");card(grid,"Gold summary",goldSummary(row,ids,gold));card(grid,"Candidate reference",referenceSummary(row));card(grid,"Expected fields",pretty(row.expected_fields));root.append(grid);
 const full=el("details");full.append(el("summary","Full candidate reference JSON"),el("pre",pretty(row.reference_json)));root.append(full);
 const section=el("section");section.append(el("h3","本 Pack 的 30 条原文与 Gold 标签"));const scroll=el("div",undefined,"scroll"),table=el("table"),head=el("tr");for(const label of ["record_id","评论原文","Gold aspects"] )head.append(el("th",label));table.append(head);
 for(const id of ids){const tr=el("tr");tr.append(el("td",id),el("td",records.get(id)?.text??"缺失"),el("td",JSON.stringify(gold.get(id)?.aspects??[])));table.append(tr)}scroll.append(table);section.append(scroll);root.append(section);
 const form=el("section");form.append(el("h3","人工审核结论 · "+REVIEWER));for(const [name,label] of [["wording_ok","表述清晰"],["answerability_ok","可按预期回答"]])field(form,name,label);
 if(row.task_type==="rate")field(form,"denominator_ok","分母定义正确（含零分母处理）");
 else form.append(el("p","分母不适用（N/A）；导出 CSV 时按协议记录 denominator_ok=yes，仅表示不适用。","muted"));
 for(const [name,label] of [["reference_ok","参考答案正确"],["proposed_edit","修改建议（如有）"],["notes","理由与核算记录（有 no 时必填说明或建议）"]])field(form,name,label);root.append(form);
}
function visibleIndices(ignoreStatus=false){const pack=$("pack-filter").value,type=$("type-filter").value,filter=ignoreStatus?"all":$("status-filter").value;
 if(!loaded[current])return [];
 return data[current].flatMap((row,i)=>{if(current==="questions"&&((pack!=="all"&&row.pack_id!==pack)||(type!=="all"&&row.task_type!==type)))return [];
 const s=reviewStatus(current,i);if(filter==="incomplete"&&s.complete||filter==="complete"&&!s.complete||filter==="review"&&!s.review)return [];return [i]})}
function render(){const list=rows(),visible=visibleIndices(),select=$("item-select");select.replaceChildren();if(visible.length&&!visible.includes(index))index=visible[0];
 const ready=loaded[current],kindPath=current==="extraction"?"01_extraction/reviewer_"+data.slot+".csv":"02_questions/reviewer_"+data.slot+".csv";
 $("import-help").textContent="Select "+kindPath+" (or your saved CSV for this section).";
 $("export").disabled=!ready;$("next-incomplete").disabled=!ready;$("status-filter").disabled=!ready;
 $("pack-filter").disabled=!ready||current==="extraction";$("type-filter").disabled=!ready||current==="extraction";
 for(const i of visible){const row=list[i],s=reviewStatus(current,i),option=el("option",(current==="extraction"?row.record_id:row.question_id)+(s.complete?(s.review?" · 待复核":" · 已完成"):" · 未完成"));option.value=String(i);select.append(option)}if(visible.length)select.value=String(index);
 $("ex-tab").classList.toggle("active",current==="extraction");$("qu-tab").classList.toggle("active",current==="questions");
 for(const id of ["item-select","previous","next"])$(id).disabled=!visible.length;
 const root=$("content");root.replaceChildren();if(!ready){root.append(el("section","Import "+kindPath+" to begin reviewing this section."));$("progress").textContent="Not loaded";$("item-status").textContent="";return}
 if(visible.length)current==="extraction"?renderExtraction(root,list[index]):renderQuestion(root,list[index]);else root.append(el("section","当前筛选无结果，请调整 Pack、题型或状态。"));progress();if(!visible.length)$("item-status").textContent="当前筛选无结果";}
function switchTo(kind){current=kind;index=0;$("pack-filter").value="all";$("type-filter").value="all";$("status-filter").value="all";render()}
for(const [id,values] of [["pack-filter",[...new Set(data.questions.map(row=>row.pack_id))]],["type-filter",[...new Set(data.questions.map(row=>row.task_type))]]]){const select=$(id);select.append(el("option","全部"));select.firstChild.value="all";for(const item of values){const option=el("option",item);option.value=item;select.append(option)}}
$("pack-filter").disabled=true;$("type-filter").disabled=true;
$("ex-tab").onclick=()=>switchTo("extraction");$("qu-tab").onclick=()=>switchTo("questions");
$("item-select").onchange=event=>{index=Number(event.target.value);render()};
for(const id of ["pack-filter","type-filter","status-filter"])$(id).onchange=()=>render();
function move(direction){const visible=visibleIndices();if(!visible.length)return;const position=visible.indexOf(index);index=visible[(position+direction+visible.length)%visible.length];render()}
$("previous").onclick=()=>move(-1);$("next").onclick=()=>move(1);
$("next-incomplete").onclick=()=>{const candidates=visibleIndices(true).filter(i=>!reviewStatus(current,i).complete);if(!candidates.length){alert("当前范围内没有未完成条目");return}index=candidates.find(i=>i>index)??candidates[0];$("status-filter").value="incomplete";render()};
function csvCell(value){const s=String(value??"");return /[",\r\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}
function csvText(kind){const fields=kind==="extraction"?data.extractionFields:data.questionFields;return "\ufeff"+[fields.join(","),...data[kind].map((source,i)=>fields.map(field=>csvCell(EDIT[kind].includes(field)?state[kind][i][field]??source[field]:source[field])).join(","))].join("\r\n")+"\r\n"}
$("export").onclick=()=>{if(!loaded[current])return;const blob=new Blob([csvText(current)],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=el("a");a.href=url;a.download="reviewer_"+data.slot+"_"+(current==="extraction"?"extraction":"questions")+"_filled.csv";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function parseCsv(text){text=text.replace(/^\ufeff/,"");const out=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else if(ch==='"')quoted=true;else if(ch===","){row.push(cell);cell=""}else if(ch==="\r"||ch==="\n"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);out.push(row);row=[];cell=""}else cell+=ch}if(quoted)throw Error("CSV 引号未闭合");if(cell||row.length){row.push(cell);out.push(row)}return out}
$("import").onchange=async event=>{const file=event.target.files?.[0];if(!file)return;try{
 if(new RegExp("reviewer[_-]"+(3-data.slot)+"(?:[_\\.-]|$)","i").test(file.name||""))throw Error("请选择本包对应 Reviewer 的 CSV");
 const parsed=parseCsv(await file.text()),kind=current,fields=kind==="extraction"?data.extractionFields:data.questionFields;
 if(parsed.length!==data[kind].length+1||parsed[0].join("\0")!==fields.join("\0"))throw Error("列名或行数与当前审核表不一致");
 const replacement=[];for(let i=0;i<data[kind].length;i++){const line=parsed[i+1];if(line.length!==fields.length)throw Error("第 "+(i+2)+" 行列数错误");const copy={};for(let j=0;j<fields.length;j++){const name=fields[j],entry=line[j];if(EDIT[kind].includes(name)){
   if(OPTIONS[name]&&entry&&!OPTIONS[name].includes(entry))throw Error("第 "+(i+2)+" 行 "+name+" 值无效");
   if((name==="reviewer"||name==="reviewer_id")&&entry&&entry!==REVIEWER)throw Error("第 "+(i+2)+" 行属于另一名 Reviewer");
   if(name==="reviewed_at"&&entry&&!validDate(entry))throw Error("第 "+(i+2)+" 行日期无效");
   if(name==="denominator_ok"&&data.questions[i].task_type!=="rate"&&entry&&entry!=="yes")throw Error("第 "+(i+2)+" 行非 Rate 题分母应为 yes 或空白");
   copy[name]=entry;
  }else if(entry!==data[kind][i][name])throw Error("第 "+(i+2)+" 行只读字段 "+name+" 已更改")}
  if(kind==="extraction")copy.reviewer=REVIEWER;else{copy.reviewer_id=REVIEWER;if(data.questions[i].task_type!=="rate")copy.denominator_ok="yes"}replacement.push(copy)}
 state[kind]=replacement;loaded[kind]=true;render();alert("已导入并核对 "+replacement.length+" 行。请继续审核，完成后重新下载 CSV。")
 }catch(error){alert("导入失败："+error.message)}finally{event.target.value=""}};
render();
</script>
</body>
</html>
